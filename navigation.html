<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ניווט לאירוע</title><link rel="icon" href="./favicon.ico" sizes="any"><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;--page:#101827;--card:#1b2940;--text:#f5f7fb;--muted:#c6d2e4;--border:#354760;--accent:#8fc6ff;--secondary:#263d5a;--waze1:#22a56f;--waze2:#14724f;--google1:#278be8;--google2:#1769c5}
*{box-sizing:border-box}
html,body{margin:0;min-width:280px}
body{min-height:100dvh;padding:clamp(8px,2.5vw,20px);background:var(--page);color:var(--text);display:grid;place-items:center}
main{width:min(100%,760px);background:var(--card);border:1px solid var(--border);border-radius:clamp(14px,3vw,22px);padding:clamp(14px,4vw,30px);overflow:hidden}
h1{margin:0;color:var(--accent);font-size:clamp(1.45rem,5vw,2.2rem);line-height:1.15}
h2{margin:clamp(12px,3vw,18px) 0 10px;font-size:clamp(1.15rem,4.3vw,1.65rem);line-height:1.25}
p{line-height:1.55;margin:7px 0;overflow-wrap:anywhere}.muted{color:var(--muted)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.theme{min-height:42px;border:1px solid var(--border);border-radius:999px;background:var(--secondary);color:var(--text);padding:7px 12px;font:inherit;cursor:pointer;white-space:nowrap}
.details{margin:clamp(12px,3vw,18px) 0;padding:clamp(10px,3vw,18px);border:1px solid var(--border);border-radius:14px}
/* Compact navigation choices, shared visual language in light and dark themes */
.actions{display:flex;justify-content:center;align-items:stretch;gap:clamp(20px,5vw,42px);margin-top:22px;direction:rtl;flex-wrap:wrap}
.navcard{width:clamp(108px,25vw,132px);min-height:122px;padding:14px 10px 12px;border:1px solid var(--border);border-radius:20px;background:var(--secondary);color:var(--text);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:background-color .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}
.navcard:hover{background:#304e70;border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.22)}
.navcard:active{transform:translateY(0);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.navcard:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.nav-logo{width:66px;height:66px;display:grid;place-items:center;flex:none}
.nav-logo svg{display:block;width:100%;height:100%}
.nav-title{font-size:.98rem;font-weight:700;line-height:1.2;text-align:center;direction:ltr}
:root[data-theme="light"] .navcard:hover{background:#d8eafb;border-color:#1767b4}
@media(prefers-reduced-motion:reduce){.navcard{transition:none}.navcard:hover,.navcard:active{transform:none}}
@media(max-width:480px){.actions{gap:clamp(18px,6vw,30px)}.navcard{width:112px;min-height:114px;padding:12px 8px}.nav-logo{width:60px;height:60px}}
@media(max-width:320px){.actions{gap:14px}.navcard{width:104px}}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;min-height:80px}.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.22);border-top-color:#55a7ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{color:#ffb7b7;padding:12px;border:1px solid #8b343c;border-radius:10px}
:root[data-theme="light"]{color-scheme:light;--page:#f0f5fc;--card:#fff;--text:#19304a;--muted:#455b72;--border:#c8d7e9;--accent:#1767b4;--secondary:#e8f1fb}
:root[data-theme="light"] .spinner{border-color:rgba(25,48,74,.2);border-top-color:#1767b4}:root[data-theme="light"] .error{color:#a91f35}

</style></head><body><main><div class="top"><h1>ניווט לאירוע</h1><button id="themeToggle" class="theme" type="button"></button></div><div id="content"><div class="loading"><span class="spinner"></span><span>טוען פרטי אירוע...</span></div></div></main><script src="js/config.js?v=V1.1.90A19P2F14Z58D5D55Z41FIX67Q65"></script><script src="js/navigation.js?v=V1.1.90A19P2F14Z58D5D55Z41FIX67Q65"></script></body></html>
