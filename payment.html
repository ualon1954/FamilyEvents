<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>תשלום לאירוע</title><link rel="icon" href="favicon.ico"><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;--page:#101827;--card:#1b2940;--text:#f5f7fb;--muted:#c6d2e4;--border:#354760;--accent:#8fc6ff;--secondary:#263d5a}
*{box-sizing:border-box}html,body{margin:0;min-width:280px}body{min-height:100dvh;padding:clamp(8px,2.5vw,20px);background:var(--page);color:var(--text);display:grid;place-items:center}
main{width:min(100%,760px);background:var(--card);border:1px solid var(--border);border-radius:clamp(14px,3vw,22px);padding:clamp(14px,4vw,30px);overflow:hidden}
h1{margin:0;color:var(--accent);font-size:clamp(1.45rem,5vw,2.2rem);line-height:1.15}h2{margin:clamp(12px,3vw,18px) 0 10px;font-size:clamp(1.15rem,4.3vw,1.65rem);line-height:1.25}p{line-height:1.55;margin:7px 0;overflow-wrap:anywhere}
.methods{display:flex;justify-content:center;align-items:stretch;gap:clamp(20px,5vw,42px);margin:clamp(20px,5vw,32px) 0;direction:rtl;flex-wrap:wrap}
.pay-link{width:clamp(108px,25vw,132px);min-height:122px;padding:14px 10px 12px;border:1px solid var(--border);border-radius:20px;background:var(--secondary);color:var(--text);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:background-color .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}
.pay-link:hover{background:#304e70;border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.22)}.pay-link:active{transform:translateY(0);box-shadow:0 2px 6px rgba(0,0,0,.15)}.pay-link:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.pay-logo{width:66px;height:66px;display:grid;place-items:center;flex:none}.pay-logo svg{display:block;width:100%;height:100%}.pay-title{font-size:.98rem;font-weight:700;line-height:1.2;text-align:center;direction:ltr}.note{font-size:.9rem;color:var(--muted);text-align:center;margin-top:14px}.error{color:#ffb7b7;padding:12px;border:1px solid #8b343c;border-radius:10px}
@media(max-width:480px){.methods{gap:clamp(18px,6vw,30px)}.pay-link{width:112px;min-height:114px;padding:12px 8px}.pay-logo{width:60px;height:60px}}@media(max-width:320px){.methods{gap:14px}.pay-link{width:104px}}
@media(prefers-reduced-motion:reduce){.pay-link{transition:none}.pay-link:hover,.pay-link:active{transform:none}}
</style></head><body><main><h1>תשלום לאירוע</h1><div id="content" aria-live="polite">טוען פרטי תשלום...</div></main><script src="js/config.js"></script><script src="js/payment.js"></script></body></html>
