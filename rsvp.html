<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>אישור הגעה</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;--page:#101827;--card:#1b2940;--text:#f5f7fb;--border:#354760;--muted:#c6d2e4;--count-bg:#243752;--unit-bg:#1b2940;--unit-border:#55718e;--input:#101827;--input-border:#8ca1bf;--secondary:#263d5a;--secondary-border:#c8d7e9;--heading:#8fc6ff;--event-heading:#f8d48a;--greeting:#a9e5d2;--clock-heading:#a8d7ff}*{box-sizing:border-box}body{background:var(--page);color:var(--text);min-height:100dvh;margin:0;padding:clamp(12px,4vw,30px);display:grid;place-items:center}main{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:clamp(18px,5vw,30px);width:min(100%,540px);overflow-wrap:anywhere}h1{margin:0 0 18px;font-size:clamp(1.45rem,5vw,2rem);color:var(--heading)}h2{font-size:clamp(1.15rem,4vw,1.5rem);color:var(--event-heading)}p{line-height:1.6}.note{background:#354760;padding:12px;border-radius:8px}.event-date{direction:ltr;unicode-bidi:isolate;display:inline-block}.loading-state{display:flex;align-items:center;justify-content:center;gap:10px;min-height:42px}.spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,.22);border-top-color:#55a7ff;border-radius:50%;animation:spin .8s linear infinite;flex:none}@keyframes spin{to{transform:rotate(360deg)}}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:20px 0}.choice{border:2px solid transparent;border-radius:12px;padding:15px 8px;min-height:60px;color:white;font:inherit;font-weight:bold;cursor:pointer;background:#34445e;transition:border-color .12s,box-shadow .12s,transform .12s}.choice[data-status="Confirmed"]{background:#176b4b}.choice[data-status="Declined"]{background:#8b343c}.choice[data-status="Pending"]{background:#7b5a20}.choice[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px #55a7ff;transform:translateY(-2px)}.choice:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #8fc6ff;outline-offset:3px}.field{margin:16px 0}.field label{display:block;margin-bottom:8px}input{font:inherit;width:100%;max-width:180px;min-height:48px;background:var(--input);color:var(--text);border:1px solid var(--input-border);border-radius:8px;padding:10px}.save{width:100%;min-height:52px;background:#247bd1;color:white;border:0;border-radius:10px;font:inherit;font-weight:bold;cursor:pointer}.save:disabled{opacity:.65;cursor:wait}.error{color:#ffb7b7}.success{background:#184d3b;border-radius:10px;padding:18px}.muted{color:var(--muted)}@media(max-width:400px){.choices{gap:4px}.choice{min-height:46px;padding:9px 2px;font-size:clamp(.68rem,3.15vw,.95rem);border-radius:8px}main{border-radius:12px;padding:clamp(10px,3vw,18px)}}@media(prefers-reduced-motion:reduce){.confetti i{animation:none;opacity:.65;top:12%;transform:rotate(25deg)}.spinner{animation-duration:2s}.choice{transition:none;transform:none!important}}
.countdown{margin:18px 0;padding:14px;border:1px solid var(--unit-border);border-radius:12px;text-align:center;background:var(--count-bg)}.countdown-units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(4px,1.5vw,10px);margin-top:12px;direction:ltr}.countdown-unit{min-width:0;background:var(--unit-bg);border:1px solid var(--unit-border);border-radius:9px;padding:clamp(6px,2vw,10px) 2px;display:flex;flex-direction:column;align-items:center;gap:4px}.countdown-unit strong{font-size:clamp(1.05rem,4.3vw,1.55rem);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}.countdown-unit span{font-size:clamp(.72rem,2.7vw,.92rem);color:var(--muted)}.countdown-unavailable{margin-top:10px}.result{padding:clamp(18px,4vw,28px);border-radius:14px;text-align:center;margin-top:18px}.result h3{font-size:clamp(1.3rem,5vw,1.8rem)}.result.confirmed{background:#14513f}.result.declined{background:#65313c}.result.pending{background:#665025}.secondary-action{display:block;width:100%;margin-top:14px;min-height:48px;border:1px solid var(--secondary-border);border-radius:10px;background:var(--secondary);color:var(--text);font:inherit;font-weight:bold;cursor:pointer}.rsvp-area{min-width:0}.result.confirmed{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 50% 5%,#247f63,#14513f 72%);border:1px solid #65d5a8;box-shadow:0 12px 35px rgba(0,0,0,.25)}.result.confirmed>*:not(.confetti){position:relative;z-index:1}.celebration-symbol{font-size:clamp(2.8rem,12vw,4.8rem);line-height:1.3;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3))}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}.confetti i{position:absolute;top:-12px;left:var(--x);width:7px;height:13px;background:hsl(var(--hue),85%,65%);border-radius:2px;opacity:0;animation:confetti-fall var(--duration) var(--delay) ease-in infinite}@keyframes confetti-fall{0%{transform:translate3d(0,-20px,0) rotate(0deg);opacity:0}8%{opacity:1}85%{opacity:1}100%{transform:translate3d(25px,350px,0) rotate(650deg);opacity:0}}@media(max-width:400px){.result{padding:16px}}

:root[data-theme="light"]{color-scheme:light;--page:#f0f5fc;--card:#ffffff;--text:#19304a;--border:#c8d7e9;--muted:#455b72;--count-bg:#eaf3ff;--unit-bg:#fff;--unit-border:#b0c7e3;--input:#fff;--input-border:#7891ad;--secondary:#e8f1fb;--secondary-border:#9ab5d2;--heading:#1767b4;--event-heading:#94600c;--greeting:#167456;--clock-heading:#185d9d}
:root[data-theme="light"] .note{background:#e8f1fb;color:#19304a}:root[data-theme="light"] .spinner{border-color:rgba(25,48,74,.2);border-top-color:#1767b4}:root[data-theme="light"] .error{color:#a91f35}:root[data-theme="light"] .result{color:#fff}:root[data-theme="light"] .result .secondary-action{background:#fff;color:#19304a}:root[data-theme="light"] .result .secondary-action:focus-visible{outline-color:#fff}
.rsvp-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.rsvp-topbar h1{margin:0}.theme-toggle{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:var(--count-bg);color:var(--text);font:inherit;cursor:pointer;white-space:nowrap}.theme-toggle:focus-visible{outline:3px solid #55a7ff;outline-offset:2px}.rsvp-greeting{color:var(--greeting);font-weight:600}.countdown>div:first-child{color:var(--clock-heading);font-weight:600}

/* V1.1.90A3: selected RSVP checkmark and accessible, theme-aware countdown accents. */
.choice{display:flex;align-items:center;justify-content:center;gap:clamp(2px,.8vw,7px)}
.choice-check{display:none;font-size:1.1em;font-weight:900;line-height:1;flex:none}
.choice[aria-pressed="true"] .choice-check{display:inline}
.countdown-unit:nth-child(1) strong{color:#8cbfff}
.countdown-unit:nth-child(2) strong{color:#a9d8c3}
.countdown-unit:nth-child(3) strong{color:#f4cd8c}
.countdown-unit:nth-child(4) strong{color:#c8b5f2}
:root[data-theme="light"] .countdown-unit:nth-child(1) strong{color:#1759a4}
:root[data-theme="light"] .countdown-unit:nth-child(2) strong{color:#12694b}
:root[data-theme="light"] .countdown-unit:nth-child(3) strong{color:#8a540a}
:root[data-theme="light"] .countdown-unit:nth-child(4) strong{color:#6738a3}
</style></head><body><main><header class="rsvp-topbar"><h1>אישור הגעה</h1><button id="theme-toggle" class="theme-toggle" type="button" aria-label="החלפת מצב תצוגה"></button></header><div id="content" aria-live="polite"><div class="loading-state" role="status"><span class="spinner" aria-hidden="true"></span><span>טוען פרטי הזמנה...</span></div></div></main><script src="js/config.js"></script><script src="js/rsvp.js?v=1.1.90A4"></script></body></html>
